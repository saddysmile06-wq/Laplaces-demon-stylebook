  el.innerHTML = `<div class="bar"><select id="gc"><option value="">Все разделы</option>${opts}</select><input id="gq" placeholder="Поиск по названию и подписи"></div><div id="gout"></div>`;
  function draw(){
    const c = $('#gc').value, q = $('#gq').value.toLowerCase();
    $('#gout').innerHTML = D.collections.filter(x => !c || x.slug === c).map(col => {
      const items = col.items.filter(i => !q || (i.title + ' ' + i.caption).toLowerCase().includes(q));
      if (!items.length) return '';
      return `<h2>${esc(col.title)}</h2><p class="intro">${esc(col.intro)}</p><div class="grid">` + items.map(i => {
        const src = `../assets/${col.slug}/${i.file}`;
        return `<figure><div class="img"><img loading="lazy" src="${src}" alt="${esc(i.title)}"></div><figcaption><b>${esc(i.title)}${i.plugin ? '<span class="badge">в плагине</span>' : ''}${i.approved ? '<span class="badge">утверждено</span>' : ''}</b><span>${esc(i.caption)}</span><small>${esc(col.slug + '/' + i.file)}</small></figcaption></figure>`;
      }).join('') + '</div>';
    }).join('') || '<p class="hint">Ничего не найдено.</p>';
  }
  $('#gc').onchange = draw; $('#gq').oninput = draw; draw();
})();

// --- Формы
(function(){
  const f = D.character.forms;
  $('#p-forms').innerHTML = `<h2>Три формы</h2><p class="intro">Лицо, волосы, рога, уши и кончик хвоста одинаковы во всех формах. Данные из <code>canon/character.json</code>.</p><div class="forms">` +
    Object.entries(f).map(([id,x]) => `<div class="card"><h3>${esc(id)}</h3><p><b>Кто:</b> ${esc(x.label)}</p><p><b>Использование:</b> ${esc(x.use)}</p><p><b>Кадр:</b> ${esc(x.framing)}</p><p><b>Одежда:</b> ${esc(x.outfit)}</p><p><b>Референс:</b> <code>${esc(x.ref)}</code></p></div>`).join('') + '</div>' +
    `<h2>Общие правила</h2><div class="card"><p><b>Стиль:</b> ${esc(D.character.style)}</p><p><b>Канон:</b> ${esc(D.character.core)}</p><p><b>Правила:</b> ${esc(D.character.rules)}</p></div>`;
})();

// --- Палитра
(function(){
  const p = D.palette;
  $('#p-palette').innerHTML = `<h2>Палитра (до ${p.max_colors} цветов)</h2><p class="intro">${esc(p.mood)}. Клик копирует hex.</p><div class="sw">` +
    p.colors.map(c => `<button data-hex="${c.hex}"><i style="background:${c.hex}"></i><span>${c.hex}<small>${esc(c.id)}: ${esc(c.role)}</small></span></button>`).join('') + '</div>';
  document.querySelectorAll('.sw button').forEach(b => b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.dataset.hex); b.querySelector('span').firstChild.textContent = 'скопировано'; setTimeout(() => b.querySelector('span').firstChild.textContent = b.dataset.hex, 900); });
})();

// --- Конструктор промптов
(function(){
  const ch = D.character, el = $('#p-prompt');
  el.innerHTML = `<h2>Конструктор промптов</h2><p class="intro">Собирает промпт из канона: стиль + персонаж + одежда и кадр формы + правила + поза. Вставляй в ChatGPT вместе с референсом.</p>
  <div class="bar"><select id="pf">${Object.keys(ch.forms).map(f => `<option>${f}</option>`).join('')}</select><select id="pp"></select></div>
  <p class="hint" id="pr"></p><div class="row"><textarea id="po" readonly></textarea><div><p class="hint">Свою позу можно дописать:</p><textarea id="pc" style="min-height:90px" placeholder="например: sitting on the floor, reading a book, tail curled"></textarea><p><button class="btn" id="cp">Копировать промпт</button></p></div></div>`;
  function poses(){ const f = $('#pf').value; $('#pp').innerHTML = D.poses.filter(p => p.form === f).map(p => `<option value="${p.id}">${p.id} (${p.kind})</option>`).join('') + '<option value="">— своя поза —</option>'; build(); }
  function build(){
    const f = $('#pf').value, x = ch.forms[f], p = D.poses.find(q => q.id === $('#pp').value), own = $('#pc').value.trim();
    const parts = [ch.style, ch.core, x.outfit, x.framing, ch.rules, own || (p ? p.prompt : '')];
    $('#po').value = parts.filter(Boolean).join(' ');
    $('#pr').textContent = 'Референс: ' + x.ref + (x.ref_fallback ? ' (запасной: ' + x.ref_fallback + ')' : '') + '.';
  }
  $('#pf').onchange = poses; $('#pp').onchange = build; $('#pc').oninput = build;
  $('#cp').onclick = () => { $('#po').select(); navigator.clipboard ? navigator.clipboard.writeText($('#po').value) : document.execCommand('copy'); $('#cp').textContent = 'Скопировано'; setTimeout(() => $('#cp').textContent = 'Копировать промпт', 900); };
  poses();
})();

// --- Лайтбокс
const lb = $('#lb');
document.addEventListener('click', e => { const d = e.target.closest('.img'); if (d) { $('img', lb).src = d.querySelector('img').src; lb.classList.add('on'); } });
lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
show((location.hash || '#gallery').slice(1).replace(/[^a-z]/g,'') || 'gallery');
</script>
</body>
</html>
